    <!-- L'onboarding su uniflat.it/profilo (13-LANCIO-PER-SOGLIA §5). Invisibile
         ai motori come il resto del sito finché Apple non approva l'app (W2). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Uniflat · Il tuo profilo</title>

    <!-- Il fondo è color.bg di theme.ts: qui non si può importare, e senza
         la pagina lampeggerebbe bianca prima che parta l'app. Su uno schermo
         largo l'app resta della misura di un telefono (web.dialog), al centro. -->
    <style id="expo-reset">
      html, body { height: 100%; background: #000000; }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; height: 100%; flex: 1; max-width: 520px; margin: 0 auto; }
      /* Il marchio mentre l'app si avvia (N33): si vede subito, React lo
         sostituisce appena parte. Stesso giallo di theme.ts. */
      .avvio { margin: auto; width: 72px; height: 72px; animation: respiro 1.4s ease-in-out infinite; }
      @keyframes respiro { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .avvio { animation: none; } }
    </style>
  </head>
